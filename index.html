<title>Tavern Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A live battle map for 5e with friends: upload maps, move tokens together, build heroes and encounters, and place spell areas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a felt game table. The battle map fills the screen; panels slide over it on phones
   and sit in a right-hand rail on wide screens. One deliberate dark look (a table at night). */
:root {
  --felt: #0f1f1b;
  --felt-deep: #091512;
  --panel: #142723;
  --raise: #1b322d;
  --raise-2: #234039;
  --line: #2a4841;
  --line-2: #36594f;
  --ink: #eee7d4;
  --ink-2: #b9c6bf;
  --ink-3: #849990;
  --brass: #d9a647;
  --brass-hi: #f3cf78;
  --brass-ink: #241a06;
  --blood: #e2654f;
  --heal: #72c690;
  --warn: #e8b84d;
  --arcane: #93bbff;
  --scrim: rgba(4, 10, 9, 0.62);
  --font-display: "IM Fell English SC", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --tabs-h: 60px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--felt);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }

/* ---------------------------------------------------------- app frame */
#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
#top > * { min-width: 0; }
@media (max-width: 560px) {
  .brand-name { display: none; }
  #top { gap: 8px; }
  .status-pill { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
}
#top {
  display: flex; align-items: center; gap: 10px;
  padding: 8px var(--gut-r) 8px var(--gut-l);
  background: var(--felt-deep);
  border-bottom: 1px solid var(--line);
  min-height: 52px; z-index: 30; position: relative;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-mark { width: 26px; height: 26px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: 21px; line-height: 1; color: var(--brass-hi); white-space: nowrap; }
.scene-pill {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 44vw;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink-2); font-size: 13px; cursor: pointer;
}
.scene-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-spacer { flex: 1; }
.peers { display: flex; align-items: center; gap: 0; }
.peer-dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #10201c; border: 2px solid var(--felt-deep); margin-left: -6px;
  background: var(--c, #888);
}
.peer-dot:first-child { margin-left: 0; }
.peer-more { background: var(--raise); color: var(--ink-2); }
.conn { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.conn.live { background: var(--heal); box-shadow: 0 0 0 3px rgba(114, 198, 144, 0.18); }
.conn.solo { background: var(--warn); }
.status-pill { font-size: 12px; color: var(--warn); border: 1px solid rgba(232, 184, 77, 0.4); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }

#main { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
#side { position: absolute; inset: 0; background: var(--panel); z-index: 20; display: flex; flex-direction: column; min-height: 0; }
#side[hidden] { display: none !important; }
.side-tabs { display: none; }
.panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.panel-in { padding: 16px var(--gut-r) 28px var(--gut-l); display: grid; gap: 16px; align-content: start; max-width: 720px; margin: 0 auto; }

#tabs {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--felt-deep); border-top: 1px solid var(--line);
  padding: 0 var(--gut-r) env(safe-area-inset-bottom, 0px) var(--gut-l); z-index: 30;
}
.tab {
  display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; background: none; border: 0;
  color: var(--ink-3); font-size: 11px; cursor: pointer; min-height: var(--tabs-h);
}
.tab svg.ic { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--brass-hi); }
.tab-badge { position: relative; }
.tab-badge::after { content: ""; position: absolute; top: -1px; right: -5px; width: 7px; height: 7px; border-radius: 50%; background: var(--blood); }

@media (min-width: 960px) {
  #main { grid-template-columns: minmax(0, 1fr) 410px; }
  #side { position: relative; inset: auto; border-left: 1px solid var(--line); display: flex !important; }
  #side[hidden] { display: flex !important; }
  #tabs { display: none; }
  .side-tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); background: var(--felt-deep); }
  .side-tab { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-3); padding: 8px 4px 9px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .side-tab svg.ic { width: 17px; height: 17px; }
  .side-tab[aria-selected="true"] { color: var(--brass-hi); border-bottom-color: var(--brass); }
  .side-tab[data-tab="table"] { display: none; }
  .panel-in { padding-left: 18px; padding-right: 18px; }
}

/* ----------------------------------------------------------- controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px; padding: 8px 14px; border-radius: 9px;
  background: var(--raise); border: 1px solid var(--line-2); color: var(--ink);
  cursor: pointer; font-size: 14px; line-height: 1.2; white-space: nowrap; touch-action: manipulation;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--raise-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); font-weight: 700; }
.btn-primary:hover { background: var(--brass-hi); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--raise); }
.btn-danger { color: var(--blood); border-color: rgba(226, 101, 79, 0.45); background: transparent; }
.btn-danger:hover { background: rgba(226, 101, 79, 0.12); }
.btn-heal { color: var(--heal); border-color: rgba(114, 198, 144, 0.45); background: transparent; }
.btn-sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn-icon { width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.grow { flex: 1; }

.field { display: grid; gap: 5px; min-width: 0; }
.field > span, .label { font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
input[type="text"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 8px;
  background: var(--felt-deep); border: 1px solid var(--line-2); color: var(--ink); font-size: 16px;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input[type="range"] { width: 100%; accent-color: var(--brass); }
input[type="checkbox"] { accent-color: var(--brass); width: 18px; height: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--felt-deep); }
.seg button { border: 0; background: none; padding: 7px 12px; color: var(--ink-2); cursor: pointer; font-size: 13px; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); font-weight: 700; }
.seg.full { display: flex; }
.seg.full button { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--felt-deep); color: var(--ink-2); font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: rgba(217, 166, 71, 0.16); border-color: var(--brass); color: var(--brass-hi); }
.chip.locked { cursor: default; border-style: dashed; color: var(--ink); }
.chip.cond[aria-pressed="true"] { background: rgba(226, 101, 79, 0.15); border-color: var(--blood); color: #ffb3a3; }
.chip:disabled { opacity: 0.4; cursor: default; }

.card { background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card-title { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.card-title h3 { font-family: var(--font-display); font-size: 19px; font-weight: 400; color: var(--brass-hi); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.hint { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.err { color: var(--blood); font-size: 13px; }
.sep { height: 1px; background: var(--line); border: 0; margin: 2px 0; }
.list { display: grid; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
  background: var(--felt-deep); border: 1px solid var(--line); min-width: 0;
}
button.row { width: 100%; font: inherit; color: inherit; text-align: left; }
.row.tap { cursor: pointer; }
.row.tap:hover { border-color: var(--line-2); background: #0c1b17; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.panel-head h2 { font-family: var(--font-display); font-size: 26px; font-weight: 400; color: var(--brass-hi); line-height: 1.1; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 22px 16px; display: grid; gap: 10px; justify-items: start; color: var(--ink-2); }
.empty h3 { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--ink); }
.disc {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--c, #555); color: #0f1f1b; font-weight: 700; font-size: 14px; overflow: hidden;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.25);
}
.disc img { width: 100%; height: 100%; object-fit: cover; }
.disc.monster { background: #3a1712; color: #ffcbbf; box-shadow: inset 0 0 0 2px var(--blood); }
.disc.sm { width: 30px; height: 30px; font-size: 11px; }
.disc.lg { width: 64px; height: 64px; font-size: 22px; }
.hpbar { height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.45); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--heal); border-radius: 3px; }
.hpbar i.mid { background: var(--warn); }
.hpbar i.low { background: var(--blood); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 7px; border-radius: 999px; background: var(--felt-deep); border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.badge.brass { border-color: var(--brass); color: var(--brass-hi); }
.badge.red { border-color: rgba(226, 101, 79, 0.6); color: #ffb3a3; }
.badge.green { border-color: rgba(114, 198, 144, 0.6); color: #a9e6bf; }
details.fold { border: 1px solid var(--line); border-radius: var(--r); background: var(--raise); }
details.fold > summary { cursor: pointer; list-style: none; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; color: var(--ink-3); font-size: 18px; line-height: 1; }
details.fold[open] > summary::after { content: "−"; }
details.fold > .fold-in { padding: 0 14px 14px; display: grid; gap: 10px; }

/* ------------------------------------------------------------- board */
#board {
  position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background:
    radial-gradient(120% 90% at 50% 35%, rgba(36, 74, 64, 0.55), rgba(0, 0, 0, 0) 70%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.018) 0 2px, rgba(0, 0, 0, 0) 2px 6px),
    var(--felt-deep);
  cursor: grab;
}
#board.tool-measure, #board.tool-ping, #board.aiming { cursor: crosshair; }
#board.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world img.mapimg { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; box-shadow: 0 10px 60px rgba(0, 0, 0, 0.6); }
.blankmap { position: absolute; left: 0; top: 0; background: #1e2a26; box-shadow: 0 10px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.04); }
.world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.world svg [data-tpl] { pointer-events: all; cursor: pointer; }
.tok {
  position: absolute; left: 0; top: 0; display: grid; place-items: center;
  transition: transform 0.22s ease; touch-action: none; cursor: pointer;
}
.tok.dragging, .tok.remote { transition: none; }
.tok.dragging { z-index: 5; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.55)); }
.tok-disc {
  width: 86%; height: 86%; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: var(--tc, #888); color: #0e1c18; font-weight: 700;
  font-size: calc(var(--g, 70) * var(--s, 1) * 0.3px); letter-spacing: -0.02em;
  box-shadow: 0 0 0 calc(var(--g, 70) * 0.045px) rgba(0, 0, 0, 0.55), 0 0 0 calc(var(--g, 70) * 0.075px) var(--tc, #888), 0 4px 10px rgba(0, 0, 0, 0.5);
}
.tok-disc img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.tok.kind-monster .tok-disc { background: radial-gradient(circle at 35% 30%, #5a2219, #2a0d09); color: #ffd2c6; --tc: var(--blood); }
.tok.kind-npc .tok-disc { color: #10201c; }
.tok.small-disc .tok-disc { width: 60%; height: 60%; }
.tok-num {
  position: absolute; right: 2%; top: 0; min-width: calc(var(--g, 70) * 0.3px); height: calc(var(--g, 70) * 0.3px);
  border-radius: 999px; background: var(--felt-deep); color: var(--ink); border: 1px solid var(--blood);
  font-size: calc(var(--g, 70) * 0.18px); display: grid; place-items: center; padding: 0 3px; font-weight: 700;
}
.tok-bar { position: absolute; left: 14%; right: 14%; bottom: 2%; height: calc(var(--g, 70) * 0.07px); border-radius: 99px; background: rgba(0, 0, 0, 0.7); overflow: hidden; }
.tok-bar i { display: block; height: 100%; background: var(--heal); }
.tok-bar i.mid { background: var(--warn); }
.tok-bar i.low { background: var(--blood); }
.tok-cond { position: absolute; left: 2%; top: 0; height: calc(var(--g, 70) * 0.28px); min-width: calc(var(--g, 70) * 0.28px); border-radius: 99px; background: #4a1a12; color: #ffd2c6; font-size: calc(var(--g, 70) * 0.17px); display: grid; place-items: center; font-weight: 700; border: 1px solid var(--blood); padding: 0 3px; }
.tok-name {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px;
  font-size: calc(var(--g, 70) * 0.19px); white-space: nowrap; padding: 1px 6px; border-radius: 6px;
  background: rgba(9, 21, 18, 0.82); color: var(--ink); pointer-events: none; opacity: 0; transition: opacity 0.15s;
}
.tok:hover .tok-name, .tok.is-sel .tok-name, .tok.dragging .tok-name, .tok.is-turn .tok-name, .show-names .tok-name { opacity: 1; }
.tok.is-sel .tok-disc { box-shadow: 0 0 0 calc(var(--g, 70) * 0.045px) rgba(0, 0, 0, 0.55), 0 0 0 calc(var(--g, 70) * 0.075px) var(--tc, #888), 0 0 0 calc(var(--g, 70) * 0.12px) var(--brass-hi), 0 4px 10px rgba(0, 0, 0, 0.5); }
.tok.is-turn::before {
  content: ""; position: absolute; inset: -6%; border-radius: 50%;
  border: calc(var(--g, 70) * 0.05px) solid var(--brass-hi); animation: turnpulse 1.6s ease-in-out infinite;
}
@keyframes turnpulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.35; } }
.tok.is-hidden { opacity: 0.45; }
.tok.is-hidden .tok-disc { outline: 2px dashed var(--ink-3); outline-offset: 2px; }
.tok.is-down .tok-disc { filter: grayscale(1) brightness(0.6); }
.tok.is-down::after { content: "✕"; position: absolute; font-size: calc(var(--g, 70) * var(--s, 1) * 0.55px); color: rgba(226, 101, 79, 0.85); font-weight: 700; pointer-events: none; }
.tok.no-move { cursor: default; }
.ghost { position: absolute; left: 0; top: 0; border: 2px dashed var(--brass-hi); border-radius: 6px; background: rgba(243, 207, 120, 0.08); pointer-events: none; }
.dist-tag {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -130%); padding: 3px 8px; border-radius: 7px;
  background: var(--brass); color: var(--brass-ink); font-weight: 700; font-size: 13px; white-space: nowrap; pointer-events: none; z-index: 6;
}
.ping { position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid var(--c, var(--brass-hi)); pointer-events: none; animation: ping 1.4s ease-out 2 forwards; }
@keyframes ping { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(3.2); opacity: 0; } }

/* board HUD */
.rail {
  position: absolute; top: 12px; right: calc(10px + env(safe-area-inset-right, 0px)); display: grid; gap: 6px; z-index: 8;
  padding: 6px; border-radius: 14px; background: rgba(9, 21, 18, 0.86); border: 1px solid var(--line); backdrop-filter: blur(6px);
}
.rail button { width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; position: relative; touch-action: manipulation; }
.rail button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
.rail button:hover:not([aria-pressed="true"]) { background: var(--raise); }
.rail .rsep { height: 1px; background: var(--line); margin: 2px 4px; }
@media (min-width: 960px) { .rail { right: auto; left: 12px; } }
.initstrip {
  position: absolute; top: 10px; left: calc(10px + env(safe-area-inset-left, 0px)); right: 76px; z-index: 7;
  display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 4px;
}
.initstrip::-webkit-scrollbar { display: none; }
@media (min-width: 960px) { .initstrip { left: 76px; right: 12px; } }
.init-chip {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border-radius: 999px;
  background: rgba(9, 21, 18, 0.88); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); cursor: pointer;
}
.init-chip .disc { width: 26px; height: 26px; font-size: 10px; }
.init-chip.now { border-color: var(--brass); color: var(--ink); background: rgba(40, 30, 8, 0.92); box-shadow: 0 0 0 2px rgba(217, 166, 71, 0.3); }
.init-chip b { color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.round-chip { flex: none; font-size: 12px; color: var(--brass-hi); padding: 6px 10px; border-radius: 999px; background: rgba(9, 21, 18, 0.88); border: 1px solid var(--brass); white-space: nowrap; }
.board-bottom {

<script>

/* ---- core.js ---- */
/* ===================================================================
   core.js — pure game logic: dice, 5e character math, encounter math,
   grid geometry. No DOM access, so it can be unit-tested in Node.
   =================================================================== */
const Core = (() => {
  'use strict';
  const ABILS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
  const ABIL_NAME = { str: 'Strength', dex: 'Dexterity', con: 'Constitution', int: 'Intelligence', wis: 'Wisdom', cha: 'Charisma' };
  const ABIL_SHORT = { str: 'STR', dex: 'DEX', con: 'CON', int: 'INT', wis: 'WIS', cha: 'CHA' };
  const SIZE_CELLS = { Tiny: 0.5, Small: 1, Medium: 1, Large: 2, Huge: 3, Gargantuan: 4 };
  const STANDARD_ARRAY = [15, 14, 13, 12, 10, 8];
  const POINT_COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };
  const MINUS = '−';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const abMod = (score) => Math.floor(((score || 10) - 10) / 2);
  const fmtMod = (n) => (n >= 0 ? '+' : MINUS) + Math.abs(n);
  const exprMod = (n) => (n === 0 ? '' : n > 0 ? '+' + n : '-' + Math.abs(n));

  /* ------------------------------------------------------------ dice */
  let rng = null; // test hook: function(sides) -> 1..sides
  function rollDie(sides) {
    if (rng) return rng(sides);
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / sides) * sides;
    let x;
    do {
      crypto.getRandomValues(buf);
      x = buf[0];
    } while (x >= limit);
    return (x % sides) + 1;
  }

  // Grammar: term (('+'|'-') term)*, term := [N]d(S|%)[kh|kl|dh|dl[N]] | N
  function parseDice(src) {
    const raw = String(src == null ? '' : src).toLowerCase();
    if (/[0-9%]\s+[0-9d]/.test(raw)) return null;
    const s = raw.replace(/\s+/g, '').replace(/−/g, '-');
    if (!s || s.length > 80) return null;
    const re = /([+-]?)(?:(\d*)d(\d+|%)((?:kh|kl|dh|dl|k|d)\d*)?|(\d+))/y;
    const terms = [];
    let i = 0;
    while (i < s.length) {
      re.lastIndex = i;
      const m = re.exec(s);
      if (!m || m[0] === '' || m[0] === '+' || m[0] === '-') return null;
      if (terms.length && !m[1]) return null;
      const sign = m[1] === '-' ? -1 : 1;
      if (m[3] !== undefined) {
        const count = m[2] === '' ? 1 : parseInt(m[2], 10);
        const sides = m[3] === '%' ? 100 : parseInt(m[3], 10);
        if (!(count >= 1 && count <= 100 && sides >= 1 && sides <= 1000)) return null;
        let keep = null;
        if (m[4]) {
          const op = m[4].replace(/\d+$/, '');
          const nRaw = m[4].slice(op.length);
          const n = nRaw === '' ? 1 : parseInt(nRaw, 10);
          if (op === 'kh' || op === 'k') keep = { hi: true, n };
          else if (op === 'kl') keep = { hi: false, n };
          else if (op === 'dl' || op === 'd') keep = { hi: true, n: count - n };
          else if (op === 'dh') keep = { hi: false, n: count - n };
          if (!keep || keep.n < 0 || keep.n > count) return null;
        }
        terms.push({ sign, count, sides, keep });
      } else {
        const value = parseInt(m[5], 10);
        if (!(value <= 100000)) return null;
        terms.push({ sign, value });
      }
      i = re.lastIndex;
    }
    return terms.length ? terms : null;
  }

  function termsToExpr(terms) {
    return terms
      .map((t, i) => {
        const sg = t.sign < 0 ? '-' : i ? '+' : '';
        if (t.value !== undefined) return sg + t.value;
        let k = '';
        if (t.keep) k = (t.keep.hi ? 'kh' : 'kl') + t.keep.n;
        return sg + t.count + 'd' + t.sides + k;
      })
      .join('');
  }

  // Roll an expression. Returns {e, t, p, nat} or null.
  //  p: parts, dice term {s, d, r:[...], x:[dropped idx]} or constant {s, v}
  //  nat: natural value of the first kept d20 (for crit/fumble), else null
  function roll(expr) {
    const terms = typeof expr === 'string' ? parseDice(expr) : expr;
    if (!terms) return null;
    let total = 0;
    let nat = null;
    const parts = terms.map((t) => {
      if (t.value !== undefined) {
        total += t.sign * t.value;
        return { s: t.sign, v: t.value };
      }
      const r = [];
      for (let i = 0; i < t.count; i++) r.push(rollDie(t.sides));
      let dropped = [];
      if (t.keep) {
        const idx = r.map((v, i) => i).sort((a, b) => (t.keep.hi ? r[b] - r[a] : r[a] - r[b]) || a - b);
        dropped = idx.slice(t.keep.n).sort((a, b) => a - b);
      }
      let sum = 0;
      r.forEach((v, i) => {
        if (!dropped.includes(i)) sum += v;
      });
      total += t.sign * sum;
      if (nat === null && t.sides === 20 && t.sign > 0) {
        const kept = r.filter((v, i) => !dropped.includes(i));
        if (kept.length === 1) nat = kept[0];
      }
      const part = { s: t.sign, d: t.sides, r };
      if (dropped.length) part.x = dropped;
      return part;
    });
    return { e: termsToExpr(terms), t: total, p: parts, nat };
  }

  function d20Expr(bonus, mode) {
    const base = mode === 'adv' ? '2d20kh1' : mode === 'dis' ? '2d20kl1' : '1d20';
    return base + exprMod(bonus);
  }

  // Double the dice of a damage expression (critical hit)
  function critExpr(expr) {
    const t = parseDice(expr);
    if (!t) return expr;
    return termsToExpr(t.map((x) => (x.value !== undefined ? x : Object.assign({}, x, { count: x.count * 2, keep: null }))));
  }

  // Average of an expression (for monster HP)
  function avgExpr(expr) {
    const t = parseDice(expr);
    if (!t) return 0;
    let a = 0;
    t.forEach((x) => {
      if (x.value !== undefined) a += x.sign * x.value;
      else a += x.sign * (x.keep ? x.keep.n : x.count) * ((x.sides + 1) / 2);
    });
    return Math.floor(a);
  }

  // Replace "MOD" in SRD heal strings and tidy spacing
  function cleanExpr(s, modVal) {
    return String(s).replace(/MOD/g, String(modVal >= 0 ? modVal : '(' + modVal + ')')).replace(/\s+/g, '').replace(/\+\(-/g, '-').replace(/\)/g, '').replace(/\+-/g, '-');
  }

  /* ---------------------------------------------- character derivation */
  const ARMORLESS = 'none';

  function proficiencyBonus(level) {
    return 2 + Math.floor((clamp(level, 1, 20) - 1) / 4);
  }

  function racialBonus(c, R) {
    const out = { str: 0, dex: 0, con: 0, int: 0, wis: 0, cha: 0 };
    const race = R.races[c.race];
    if (race) {
      for (const k in race.bonus) out[k] += race.bonus[k];
      if (race.choose && Array.isArray(c.raceChoice)) {
        c.raceChoice.slice(0, race.choose).forEach((ab) => {
          if (out[ab] !== undefined && !race.bonus[ab]) out[ab] += 1;
        });
      }
    }
    const sub = c.subrace && R.subraces[c.subrace];
    if (sub && sub.race === c.race) for (const k in sub.bonus) out[k] += sub.bonus[k];
    return out;
  }

  function asiPoints(c, R) {
    const cls = R.classes[c.cls];
    if (!cls) return 0;
    const L = cls.levels[clamp(c.level || 1, 1, 20) - 1];
    return (L ? L.asi || 0 : 0) * 2;
  }

  function pointBuyCost(base) {
    let total = 0;
    for (const ab of ABILS) {
      const v = base[ab];
      if (POINT_COST[v] === undefined) return null;
      total += POINT_COST[v];
    }
    return total;
  }

  function weaponProficient(widx, c, R) {
    const cls = R.classes[c.cls];
    if (cls && cls.weapons.includes(widx)) return true;
    const traits = raceTraitIds(c, R);
    for (const t of traits) {
      const tr = R.traits[t];
      if (!tr || !tr.profs) continue;
      for (const p of tr.profs) {
        const w = p.replace(/s$/, '');
        if (w === widx) return true;
      }
    }
    return false;
  }

  function raceTraitIds(c, R) {
    const out = [];
    const race = R.races[c.race];
    if (race) out.push(...race.traits);
    const sub = c.subrace && R.subraces[c.subrace];
    if (sub && sub.race === c.race) out.push(...sub.traits);
    if (c.race === 'dragonborn' && c.ancestry && R.traits[c.ancestry]) out.push(c.ancestry);
    return out;
  }

  function racialSkills(c, R) {
    const set = new Set();
    for (const t of raceTraitIds(c, R)) {
      const tr = R.traits[t];
      if (tr && tr.profs) tr.profs.forEach((p) => p.startsWith('skill-') && set.add(p.slice(6)));
    }
    if (c.race === 'half-elf' && Array.isArray(c.raceSkills)) c.raceSkills.slice(0, 2).forEach((s) => set.add(s));
    return set;
  }

  function backgroundSkills(c, R) {
    if (c.background && c.background !== 'custom' && R.backgrounds[c.background]) return new Set(R.backgrounds[c.background].skills);
    return new Set((c.bgSkills || []).slice(0, 2));
  }

  function expertiseSlots(c) {
    const lv = c.level || 1;
    if (c.cls === 'rogue') return lv >= 6 ? 4 : 2;
    if (c.cls === 'bard') return lv >= 10 ? 4 : lv >= 3 ? 2 : 0;
    return 0;
  }

  function derive(c, R) {
    const cls = R.classes[c.cls] || Object.values(R.classes)[0];
    const level = clamp(parseInt(c.level, 10) || 1, 1, 20);
    const L = cls.levels[level - 1] || {};
    const pb = L.pb || proficiencyBonus(level);
    const race = R.races[c.race] || null;
    const base = Object.assign({ str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 }, c.base || {});
    const rb = racialBonus(c, R);
    const asi = c.asi || {};
    const scores = {};
    const mods = {};
    for (const ab of ABILS) {
      const before = (parseInt(base[ab], 10) || 10) + rb[ab];
      const add = parseInt(asi[ab], 10) || 0;
      scores[ab] = add > 0 ? Math.max(before, Math.min(20, before + add)) : before + add;
      mods[ab] = abMod(scores[ab]);
    }
    const sub = (cls.subs || []).find((s) => s.i === c.subclass && level >= s.start) || null;

    // saves
    const saves = {};
    for (const ab of ABILS) {
      const prof = cls.saves.includes(ab);
      saves[ab] = { prof, bonus: mods[ab] + (prof ? pb : 0) };
    }

    // skills
    const profSet = new Set([...(c.skills || []), ...backgroundSkills(c, R), ...racialSkills(c, R)]);
    const expSet = new Set((c.expertise || []).filter((s) => profSet.has(s)).slice(0, expertiseSlots(c)));
    const joat = c.cls === 'bard' && level >= 2 ? Math.floor(pb / 2) : 0;
    const skills = {};
    for (const sk in R.skills) {
      const ab = R.skills[sk].ab;
      const prof = profSet.has(sk);
      const exp = prof && expSet.has(sk);
      skills[sk] = { ab, prof, exp, bonus: mods[ab] + (exp ? pb * 2 : prof ? pb : joat) };
    }
    const passive = 10 + skills.perception.bonus;

    // armor & AC
    const armor = c.armor && c.armor !== ARMORLESS ? R.armor[c.armor] : null;
    const shield = !!c.shield;
    let ac;
    let acNote = '';
    if (armor) {
      ac = armor.base + (armor.dex ? (armor.max != null ? Math.min(mods.dex, armor.max) : mods.dex) : 0);
      acNote = armor.n;
    } else if (c.cls === 'barbarian') {
      ac = 10 + mods.dex + mods.con;
      acNote = 'Unarmored Defense';
    } else if (c.cls === 'monk' && !shield) {
      ac = 10 + mods.dex + mods.wis;
      acNote = 'Unarmored Defense';
    } else if (sub && sub.i === 'draconic') {
      ac = 13 + mods.dex;
      acNote = 'Draconic Resilience';
    } else {
      ac = 10 + mods.dex;
      acNote = 'No armor';
    }
    if (shield) {
      ac += 2;
      acNote += ', shield';
    }
    ac += parseInt(c.acBonus, 10) || 0;

    // speed
    let speed = race ? race.speed : 30;
    const cs = L.cs || {};
    if (c.cls === 'monk' && !armor && !shield && cs.unarmored_movement) speed += cs.unarmored_movement;
    if (c.cls === 'barbarian' && level >= 5 && !(armor && armor.cat === 'Heavy')) speed += 10;
    speed += parseInt(c.speedBonus, 10) || 0;

    // hit points
    const hd = cls.hd;
    let hpMax;
    if (c.hpMode === 'manual' && parseInt(c.hpManual, 10) > 0) {
      hpMax = parseInt(c.hpManual, 10);
    } else {
      hpMax = hd + mods.con;
      for (let i = 2; i <= level; i++) hpMax += Math.max(1, Math.floor(hd / 2) + 1 + mods.con);
      if (c.subrace === 'hill-dwarf') hpMax += level;
      if (sub && sub.i === 'draconic') hpMax += level;
      hpMax = Math.max(1, hpMax);
    }

    const init = mods.dex + joat;

    // spellcasting
    let cast = null;
    if (cls.cast && L.slots) {
      const ab = cls.cast;
      const slots = L.slots.slice();
      const isPact = c.cls === 'warlock';
      let maxLvl = 0;
      slots.forEach((n, i) => {
        if (n > 0) maxLvl = i + 1;
      });
      let prepared = null;
      if (['cleric', 'druid', 'wizard'].includes(c.cls)) prepared = Math.max(1, mods[ab] + level);
      if (c.cls === 'paladin') prepared = Math.max(1, mods[ab] + Math.floor(level / 2));
      cast = {
        ab, dc: 8 + pb + mods[ab], atk: pb + mods[ab], mod: mods[ab], slots, pact: isPact, maxLvl,
        cantrips: L.cantrips || 0, known: L.known || null, prepared,
      };
    }

    // attacks
    const attacks = [];
    const strM = mods.str;
    const dexM = mods.dex;
    const ma = c.cls === 'monk' && cs.martial_arts ? cs.martial_arts.dice_count + 'd' + cs.martial_arts.dice_value : null;
    for (const w of c.weapons || []) {
      const W = R.weapons[w];
      if (!W) continue;
      const finesse = W.props.includes('finesse');
      const ranged = W.rng === 'Ranged';
      const monkW = !!ma && (w === 'shortsword' || (W.cat === 'Simple' && !ranged && !W.props.includes('heavy') && !W.props.includes('two-handed')));
      let m = ranged ? dexM : finesse || monkW ? Math.max(strM, dexM) : strM;
      const prof = weaponProficient(w, c, R);
      let dice = W.dmg || '1';
      if (monkW && ma) {
        const a = avgExpr(ma);
        const b = avgExpr(dice);
        if (a > b) dice = ma;
      }
      const at = { id: w, n: W.n, hit: m + (prof ? pb : 0), dmg: dice + exprMod(m), ty: W.ty, prof };
      if (W.vers) at.vers = W.vers + exprMod(m);
      if (W.range) at.range = W.range.filter(Boolean).join('/') + ' ft';
      else if (W.thrown) at.range = 'thrown ' + W.thrown.filter(Boolean).join('/') + ' ft';
      else at.range = W.props.includes('reach') ? 'reach 10 ft' : 'reach 5 ft';
      attacks.push(at);
    }
    const unarmedM = ma ? Math.max(strM, dexM) : strM;
    attacks.push({ id: 'unarmed', n: 'Unarmed Strike', hit: unarmedM + pb, dmg: ma ? ma + exprMod(unarmedM) : String(Math.max(1, 1 + unarmedM)), ty: 'Bludgeoning', prof: true, range: 'reach 5 ft' });

    // dragonborn breath weapon
    let breath = null;
    if (c.race === 'dragonborn' && c.ancestry && R.traits[c.ancestry] && R.traits[c.ancestry].breath) {
      const b = R.traits[c.ancestry].breath;
      const dice = level >= 16 ? '5d6' : level >= 11 ? '4d6' : level >= 6 ? '3d6' : '2d6';
      const shape = b.shape === 'line' ? 'line' : 'cone';
      breath = { dmg: dice, ty: b.type, dc: 8 + mods.con + pb, save: b.save || 'dex', area: shape === 'line' ? { shape, size: 30, width: 5, self: true } : { shape, size: 15, self: true } };
    }

    // features
    const features = [];
    for (let i = 0; i < level; i++) {
      for (const f of cls.levels[i].feats || []) features.push({ id: f, lvl: i + 1, src: cls.n });
    }
    if (sub) {
      for (const lv in sub.levels) if (parseInt(lv, 10) <= level) sub.levels[lv].forEach((f) => features.push({ id: f, lvl: parseInt(lv, 10), src: sub.n }));
    }
    features.sort((a, b) => a.lvl - b.lvl);
    const traits = raceTraitIds(c, R);

    // resources
    const resources = [];
    const add = (key, n, max) => max > 0 && resources.push({ key, n, max });
    if (c.cls === 'barbarian') add('rage', 'Rage', cs.rage_count === 9999 ? 99 : cs.rage_count || 0);
    if (c.cls === 'monk' && level >= 2) add('ki', 'Ki points', cs.ki_points || 0);
    if (c.cls === 'sorcerer' && level >= 2) add('sorcery', 'Sorcery points', cs.sorcery_points || 0);
    if (c.cls === 'cleric' && level >= 2) add('channel', 'Channel Divinity', cs.channel_divinity_charges || 0);
    if (c.cls === 'paladin' && level >= 3) add('channel', 'Channel Divinity', 1);
    if (c.cls === 'fighter') {
      add('second-wind', 'Second Wind', 1);
      if (level >= 2) add('surge', 'Action Surge', cs.action_surges || 1);
      if (level >= 9) add('indomitable', 'Indomitable', cs.indomitable_uses || 1);
    }
    if (c.cls === 'bard') add('inspiration', 'Bardic Inspiration (' + (cs.bardic_inspiration_die ? 'd' + cs.bardic_inspiration_die : 'd6') + ')', Math.max(1, mods.cha));
    if (c.cls === 'paladin') {
      add('lay-on-hands', 'Lay on Hands (HP pool)', 5 * level);
      add('divine-sense', 'Divine Sense', 1 + Math.max(0, mods.cha));
    }
    if (c.cls === 'druid' && level >= 2) add('wild-shape', 'Wild Shape', 2);
    if (c.cls === 'wizard') add('arcane-recovery', 'Arcane Recovery', 1);
    if (breath) add('breath', 'Breath Weapon', 1);
    for (const r of c.customRes || []) if (r && r.n) resources.push({ key: 'c:' + r.id, n: r.n, max: clamp(parseInt(r.max, 10) || 1, 1, 999), custom: true });

    const classSpecific = [];
    if (cs.sneak_attack) classSpecific.push(['Sneak Attack', cs.sneak_attack.dice_count + 'd' + cs.sneak_attack.dice_value]);
    if (ma) classSpecific.push(['Martial Arts', ma]);
    if (cs.rage_damage_bonus) classSpecific.push(['Rage damage', '+' + cs.rage_damage_bonus]);
    if (cs.brutal_critical_dice) classSpecific.push(['Brutal Critical', '+' + cs.brutal_critical_dice + ' die']);
    if (cs.extra_attacks) classSpecific.push(['Attacks per action', String(1 + cs.extra_attacks)]);
    if (cs.wild_shape_max_cr !== undefined && level >= 2) classSpecific.push(['Wild Shape max CR', crLabel(cs.wild_shape_max_cr)]);
    if (cs.invocations_known) classSpecific.push(['Invocations known', String(cs.invocations_known)]);
    if (cs.metamagic_known) classSpecific.push(['Metamagic known', String(cs.metamagic_known)]);
    if (cs.destroy_undead_cr) classSpecific.push(['Destroy Undead CR', crLabel(cs.destroy_undead_cr)]);
    if (cs.aura_range) classSpecific.push(['Aura range', cs.aura_range + ' ft']);
    if (cs.favored_enemies) classSpecific.push(['Favored enemies', String(cs.favored_enemies)]);

    return {

    conn.onHello = () => {
      // a reconnect gives a new peer id: send everything again
      pending = Object.assign({}, mine);
      flush();
    };
    return {
      local: false,
      async presence(patch) {
        for (const k in patch) {
          if (patch[k] === null) delete mine[k];
          else mine[k] = patch[k];
        }
        pending = Object.assign(pending || {}, patch);
        if (!timer) timer = setTimeout(flush, 60);
      },
      peers: () => peers,
      onPeers(fn) {
        fns.add(fn);
        queueMicrotask(() => fn({ peers, joined: [], left: [], updated: [] }));
        return () => fns.delete(fn);
      },
      async emit() { /* the table uses presence only */ },
      on: () => () => {},
      connected: () => conn.live,
    };
  }

  /* ------------------------------------------------- db-backed backend */
  function remoteBackend(db) {
    const wrap = (snapDocs) => snapDocs.filter((d) => d.exists !== false).map((d) => ({ id: d.id, raw: d.data() }));
    return {
      kind: 'remote',
      watchCol(col, opts, cb, onErr) {
        let q = db.collection(col);
        if (opts && opts.orderBy) q = q.orderBy(opts.orderBy, opts.dir || 'asc');
        if (opts && opts.limit) q = q.limit(opts.limit);
        return q.onSnapshot((snap) => cb(wrap(snap.docs), snap.metadata || {}), (e) => onErr && onErr(e));
      },
      watchDoc(path, cb, onErr) {
        return db.doc(path).onSnapshot((snap) => cb(snap.exists ? snap.data() : null, snap.metadata || {}), (e) => onErr && onErr(e));
      },
      set: (path, data) => db.doc(path).set(data),
      upd: (path, patch) => db.doc(path).update(patch),
      del: (path) => db.doc(path).delete(),
      async get(path) {
        const s = await db.doc(path).get();
        return s.exists ? s.data() : null;
      },
    };
  }

  /* --------------------------------------------- local stand-in room */
  function localRoom() {
    let bc;
    try {
      bc = new BroadcastChannel('tt.local.room');
    } catch (e) {
      return null;
    }
    const peer = uid('l');
    let mine = {};
    const others = new Map();
    const peerFns = new Set();
    const topicFns = new Map();
    let frozen = [];
    function rebuild() {
      const list = [{ peer, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: Object.freeze(Object.assign({}, mine)), updatedAt: Date.now() }];
      others.forEach((o, p) => list.push({ peer: p, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: o.presence, updatedAt: o.t }));
      frozen = Object.freeze(list);
      peerFns.forEach((fn) => fn({ peers: frozen, joined: [], left: [], updated: [] }));
    }
    function post(m) {
      try {
        bc.postMessage(m);
      } catch (e) { /* ignore */ }
    }
    bc.onmessage = (ev) => {
      const m = ev.data || {};
      if (m.t === 'p') {
        others.set(m.peer, { presence: Object.freeze(m.presence || {}), t: Date.now() });
        rebuild();
      } else if (m.t === 'hello') {
        post({ t: 'p', peer, presence: mine });
      } else if (m.t === 'bye') {
        others.delete(m.peer);
        rebuild();
      } else if (m.t === 'e') {
        const fns = topicFns.get(m.topic);
        if (fns) fns.forEach((fn) => fn({ topic: m.topic, data: m.data, peer: m.peer, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false }));
      }
    };
    setInterval(() => {
      post({ t: 'p', peer, presence: mine });
      const now = Date.now();
      let changed = false;
      others.forEach((o, p) => {
        if (now - o.t > 7000) {
          others.delete(p);
          changed = true;
        }
      });
      if (changed) rebuild();
    }, 2500);
    addEventListener('pagehide', () => post({ t: 'bye', peer }));
    post({ t: 'hello' });
    return {
      local: true,
      async presence(patch) {
        for (const k in patch) {
          if (patch[k] === null) delete mine[k];
          else mine[k] = patch[k];
        }
        post({ t: 'p', peer, presence: mine });
        rebuild();
      },
      peers: () => frozen,
      onPeers(fn) {
        peerFns.add(fn);
        queueMicrotask(rebuild);
        return () => peerFns.delete(fn);
      },
      async emit(topic, data) {
        post({ t: 'e', topic, data, peer });
        const fns = topicFns.get(topic);
        if (fns) fns.forEach((fn) => fn({ topic, data, peer, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false }));
      },
      on(topic, fn) {
        if (!topicFns.has(topic)) topicFns.set(topic, new Set());
        topicFns.get(topic).add(fn);
        return () => topicFns.get(topic).delete(fn);
      },
      connected: () => true,
    };
  }

  /* ------------------------------------------------------ write queue */
  const Q = new Map();
  function mergeOp(prev, next) {
    if (!prev || next.t === 'del' || next.t === 'set') return next;
    if (prev.t === 'set') return { t: 'set', d: deepMerge(prev.d, next.d) };
    if (prev.t === 'upd') return { t: 'upd', d: deepMerge(prev.d, next.d) };
    return prev; // a patch after a delete must not bring back a half-empty document
  }
  // Only these documents may be created by a patch (game/state starts out missing)
  const UPSERT_PATH = /^game\//;
  function enqueue(path, op) {
    if (S.readOnly) {
      toastWarn('This view is read-only.');
      return Promise.resolve(false);
    }
    if (S.relay) return Promise.resolve(relaySend(path, op));
    let q = Q.get(path);
    if (!q) Q.set(path, (q = { busy: false, next: null, waiters: [] }));
    q.next = mergeOp(q.next, op);
    const p = new Promise((res) => q.waiters.push(res));
    if (!q.busy) pump(path, q);
    return p;
  }
  async function pump(path, q) {
    q.busy = true;
    while (q.next) {
      const op = q.next;
      const waiters = q.waiters;
      q.next = null;
      q.waiters = [];
      let ok = false;
      if (S.relay) ok = relaySend(path, op);
      else ok = await execWithRecovery(path, op);
      waiters.forEach((w) => w(ok));
    }
    q.busy = false;
  }
  function exec(path, op) {
    const B = S.backend;
    if (op.t === 'set') return B.set(path, op.d);
    if (op.t === 'upd') return B.upd(path, op.d);
    return B.del(path);
  }
  async function execWithRecovery(path, op) {
    try {
      await exec(path, op);
      writeOk();
      return true;
    } catch (e) {
      const code = (e && e.code) || 'unavailable';
      if (code === 'unavailable' || code === 'resource_exhausted') {
        await sleep(400 + Math.random() * 700);
        try {
          await exec(path, op);
          writeOk();
          return true;
        } catch (e2) {
          return writeFailed(e2, path, op);
        }
      }
      if (code === 'invalid_argument' && op.t === 'upd') {
        let exists = null;
        try {
          exists = !!(await S.backend.get(path));
        } catch (e3) { /* unknown */ }
        if (exists === false && !UPSERT_PATH.test(path)) {
          // patching something that was deleted (a drop landing after someone removed the token): nothing to do
          return false;
        }
        if (exists === false) {
          try {
            await exec(path, { t: 'set', d: op.d });
            writeOk();
            return true;
          } catch (e4) {
            return writeFailed(e4, path, { t: 'set', d: op.d });
          }
        }
      }
      return writeFailed(e, path, op);
    }
  }
  function writeOk() {
    if (S.canWrite !== true) {
      S.canWrite = true;
      pushPresence({ w: 1 });
      emit('me');
    }
  }
  function writeFailed(e, path, op) {
    const code = e && e.code;
    console.warn('write failed', path, e);
    if ((code === 'invalid_argument' || code === 'not_granted') && S.canWrite !== true && sizeOf(op) < 200000) {
      enterRelay();
      return relaySend(path, op);
    }
    if (code === 'quota_exceeded') toastWarn('The table’s storage is full. Delete an old scene or clear the log, then try again.');
    else if (code === 'revoked') {
      S.readOnly = true;
      emit('me');
    } else toastWarn('That change didn’t save. Check your connection and try again.');
    return false;
  }
  let toastFn = (m) => console.warn(m);
  const toastWarn = (m) => toastFn(m, 'warn');

  // JSON round-trip drops undefined values before anything reaches the store
  const W = {
    set: (path, data) => enqueue(path, { t: 'set', d: clone(data) }),
    upd: (path, patch) => enqueue(path, { t: 'upd', d: clone(patch) }),
    del: (path) => enqueue(path, { t: 'del' }),
  };

  /* ------------------------------------------------------------ relay */
  const RELAY_PATH = /^(tokens|templates|log|init|chars|game)\/[A-Za-z0-9_.~:@+-]{1,80}$/;
  const RELAY_MAX = 2300;
  const relay = { seq: 0, ops: [] };
  const execState = { applied: new Map(), lastAck: '' };
  let myPresence = {};

  function enterRelay() {
    if (S.relay) return;
    S.relay = true;
    S.canWrite = false;
    emit('me');
  }
  function splitOp(op) {
    if (op.t === 'del' || sizeOf(op) <= RELAY_MAX) return [op];
    const parts = [];
    let cur = {};
    let first = op.t === 'set';
    let dropped = false;
    const flush = () => {
      if (!Object.keys(cur).length) return;
      parts.push({ t: first ? 'set' : 'upd', d: cur });
      first = false;
      cur = {};
    };
    for (const k in op.d) {
      const one = { [k]: op.d[k] };
      if (sizeOf(one) > RELAY_MAX - 60) {
        dropped = true;
        continue;
      }
      if (sizeOf(Object.assign({}, cur, one)) > RELAY_MAX - 60) flush();
      cur[k] = op.d[k];
    }
    flush();
    if (dropped) toastWarn('Some details were too large to send from this view (like a portrait photo).');
    return parts;
  }
  function relaySend(path, op) {
    if (!S.room) {
      toastWarn('This view is read-only.');
      return false;
    }
    if (!RELAY_PATH.test(path) || (path.startsWith('game/') && op.t !== 'upd')) {
      toastWarn('Only someone with edit access can do that.');
      return false;
    }
    for (const part of splitOp(op)) {
      const prev = relay.ops.length ? relay.ops[relay.ops.length - 1] : null;
      if (prev && prev.p === path && prev.t !== 'del' && part.t === 'upd' && sizeOf(deepMerge(prev.d, part.d)) <= RELAY_MAX) {
        prev.d = deepMerge(prev.d, part.d);
        prev.s = ++relay.seq;
      } else relay.ops.push({ s: ++relay.seq, p: path, t: part.t, d: part.d });
    }

  }
  function validRelayOp(o) {
    if (!o || typeof o.p !== 'string' || !RELAY_PATH.test(o.p)) return false;
    if (!['set', 'upd', 'del'].includes(o.t)) return false;
    if (o.p.startsWith('game/') && (o.t !== 'upd' || o.p !== 'game/state')) return false;
    if (o.t !== 'del' && !isObj(o.d)) return false;
    return true;
  }
  function relayTick(peers) {
    const me = peers.find((p) => p.sameTab);
    S.myPeer = me ? me.peer : null;
    const writers = peers.filter((p) => p.kind === 'viewer' && p.presence && p.presence.w === 1).sort((a, b) => (a.peer < b.peer ? -1 : 1));
    const ex = writers[0] || null;
    const hadExec = S.executorPresent;
    S.executorPresent = !!ex;
    if (S.relay && me) {
      const ack = ex && ex.presence.ack && ex.presence.ack[me.peer];
      if (ack) {
        const n = relay.ops.length;
        relay.ops = relay.ops.filter((o) => o.s > ack);
        if (relay.ops.length !== n) {
          pushPresence({ ops: relay.ops.length ? relay.ops : null });
          emit('relay');
        }
      }
    }
    if (hadExec !== S.executorPresent) emit('relay');
    if (!ex || !me || ex.peer !== me.peer || S.relay) return;
    const acks = {};
    for (const p of peers) {
      if (p.sameTab) continue;
      const ops = p.presence && Array.isArray(p.presence.ops) ? p.presence.ops : null;
      if (!ops || !ops.length) continue;
      let last = execState.applied.get(p.peer) || 0;
      ops.slice().sort((a, b) => a.s - b.s).forEach((o) => {
        if (!(o.s > last)) return;
        if (validRelayOp(o)) {
          if (o.t === 'set') W.set(o.p, o.d);
          else if (o.t === 'upd') W.upd(o.p, o.d);
          else W.del(o.p);
        }
        last = o.s;
      });
      execState.applied.set(p.peer, last);
      acks[p.peer] = last;
    }
    const sig = JSON.stringify(acks);
    if (sig !== execState.lastAck) {
      execState.lastAck = sig;
      pushPresence({ ack: Object.keys(acks).length ? acks : null });
    }
  }

  /* --------------------------------------------------------- presence */
  function pushPresence(patch) {
    for (const k in patch) {
      if (patch[k] === null) delete myPresence[k];
      else myPresence[k] = patch[k];
    }
    if (S.room) {
      try {
        const p = S.room.presence(patch);
        if (p && p.catch) p.catch((e) => console.warn('presence', e && e.code));
      } catch (e) { /* ignore */ }
    }
  }
  function basePresence() {
    pushPresence({ pk: S.me.pk, nm: (S.me.nick || '').slice(0, 40), col: S.me.color, ch: S.myChar || null, dm: S.dm ? 1 : 0, w: S.canWrite === true ? 1 : 0, sc: S.game.scene || null });
  }

  /* ---------------------------------------------------- subscriptions */
  const loadedSet = new Set();
  const NEEDED = ['game', 'scenes', 'tokens', 'tpls', 'chars', 'init', 'encs', 'log'];
  let loadTimer = 0;
  function markLoaded(name, meta) {
    if (meta && meta.fromCache) return;
    loadedSet.add(name);
    if (!S.loaded && NEEDED.every((n) => loadedSet.has(n))) {
      S.loaded = true;
      S.stale = false;
      clearTimeout(loadTimer);
      emit('loaded');
    }
  }
  function mapFrom(rows, prev) {
    const m = new Map();
    rows.forEach((r) => {
      const old = prev && prev.get(r.id);
      if (old && old.__raw === r.raw) m.set(r.id, old);
      else {
        const o = Object.assign({}, r.raw, { id: r.id });
        Object.defineProperty(o, '__raw', { value: r.raw, enumerable: false });
        m.set(r.id, o);
      }
    });
    return m;
  }
  let logSeen = null;
  function subscribeAll() {
    const B = S.backend;
    const err = (name) => (e) => {
      console.warn('listener ended', name, e);
      if (e && e.code === 'revoked') {
        S.readOnly = true;
        emit('me');
      }
    };
    loadTimer = setTimeout(() => {
      if (!S.loaded) {
        S.stale = true;
        emit('loaded');
      }
    }, 10000);
    B.watchDoc('game/state', (d, meta) => {
      S.game = d ? Object.assign({}, d) : {};
      markLoaded('game', meta);
      emit('game');
      if (myPresence.sc !== (S.game.scene || null)) pushPresence({ sc: S.game.scene || null });
    }, err('game'));
    const col = (path, key, evt, opts) => B.watchCol(path, opts || null, (rows, meta) => {
      S[key] = mapFrom(rows, S[key]);
      markLoaded(key, meta);
      emit(evt);
    }, err(path));
    col('scenes', 'scenes', 'scenes');
    col('tokens', 'tokens', 'tokens');
    col('templates', 'tpls', 'tpls');
    col('chars', 'chars', 'chars');
    col('init', 'init', 'init');
    col('encounters', 'encs', 'encs');
    B.watchCol('log', { orderBy: 'ts', dir: 'desc', limit: 80 }, (rows, meta) => {
      const list = rows.map((r) => Object.assign({}, r.raw, { id: r.id })).reverse();
      const fresh = [];
      if (logSeen) list.forEach((e) => !logSeen.has(e.id) && fresh.push(e));
      logSeen = new Set(list.map((e) => e.id));
      S.log = list;
      markLoaded('log', meta);
      emit('log', fresh);
    }, err('log'));
  }

  /* ----------------------------------------------------- room wiring */
  const lastPing = new Map();
  function wireRoom() {
    const room = S.room;
    if (!room) return;
    room.onPeers((ch) => {
      S.peers = ch.peers || room.peers();
      try {
        relayTick(S.peers);
      } catch (e) {
        console.error(e);
      }
      // pings from other people: a new pg value in their presence
      S.peers.forEach((p) => {
        if (p.sameTab || !p.presence) return;
        const pg = p.presence.pg;
        const key = p.peer;
        const seen = lastPing.get(key);
        const t = pg && pg.t;
        if (seen === undefined) {
          lastPing.set(key, t || 0);
          return;
        }
        if (pg && t && t !== seen) {
          lastPing.set(key, t);
          emit('ping', { x: pg.x, y: pg.y, sc: pg.sc, col: p.presence.col || '#d8a54a' });
        }
      });
      emit('peers', ch);
    }, (e) => console.warn('room', e && e.code));
    basePresence();
  }

  /* ------------------------------------------------------------- data */
  const DATA = {};
  function loadData(name) {
    if (!DATA[name]) {
      DATA[name] = fetch('data/' + name + '.json').then((r) => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then((d) => {
        if (name === 'monsters' || name === 'spells') {
          const idx = new Map();
          d.forEach((x) => idx.set(x.i, x));
          Data[name + 'ById'] = idx;
        }
        Data[name] = d;
        emit('data', name);
        return d;
      });
      DATA[name].catch(() => {
        delete DATA[name];
      });
    }
    return DATA[name];
  }
  const Data = { rules: null, spells: null, monsters: null, features: null, spellsById: null, monstersById: null };

  /* ------------------------------------------------------- map images */
  const CHUNK = 190000;
  async function fetchMap(scene) {
    if (!scene || !scene.mapId) return null;
    const have = S.maps.get(scene.mapId);
    if (have && have.status !== 'error') return have;
    // carry the retry flag over, or the board's one automatic retry repeats forever
    const entry = { status: 'loading', url: null, progress: 0, retried: !!(have && have.retried) };
    S.maps.set(scene.mapId, entry);
    emit('maps');
    try {
      const n = scene.chunks || 0;
      const parts = new Array(n);
      let next = 0;
      let done = 0;
      const worker = async () => {
        while (next < n) {
          const i = next++;
          let d = null;
          for (let attempt = 0; attempt < 3 && !d; attempt++) {
            try {
              d = await S.backend.get('mapchunks/' + scene.mapId + '_' + i);
            } catch (e) {
              await sleep(500 * (attempt + 1));
            }
          }
          if (!d || typeof d.d !== 'string') throw new Error('missing map piece ' + i);
          parts[i] = d.d;
          done++;
          entry.progress = done / n;
          emit('maps');
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      const b64 = parts.join('');
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      entry.url = URL.createObjectURL(new Blob([bytes], { type: scene.mime || 'image/jpeg' }));
      entry.status = 'ready';
    } catch (e) {
      console.warn('map load failed', e);
      entry.status = 'error';
    }
    emit('maps');
    return entry;
  }

  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).replace(/^data:[^,]*,/, ''));
      fr.onerror = () => rej(fr.error);
      fr.readAsDataURL(blob);
    });
  }
  function canvasBlob(canvas, type, q) {
    return new Promise((res) => canvas.toBlob((b) => res(b), type, q));
  }
  async function loadImage(file) {

        img.onload = res;
        img.onerror = () => rej(new Error('That file isn’t an image this browser can open.'));

      });

    } finally {

    }
